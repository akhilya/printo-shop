services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -U medusa -d medusa -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - printo-pg

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - shop_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/akhilya/printo-shop/backend:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
      POSTGRES_HOST: printo-pg
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shop_uploads:/app/static
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-backend.rule=Host(`${API_HOST}`)
      - traefik.http.routers.shop-backend.entrypoints=websecure
      - traefik.http.routers.shop-backend.tls.certResolver=letsencrypt
      - traefik.http.routers.shop-backend.priority=10
      - traefik.http.services.shop-backend.loadbalancer.server.port=9000

  static:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - shop_uploads:/usr/share/nginx/html:ro
      - ./deploy/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.shop-static-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable
      - traefik.http.routers.shop-backend-static.rule=Host(`${API_HOST}`) && PathPrefix(`/static`)
      - traefik.http.routers.shop-backend-static.entrypoints=websecure
      - traefik.http.routers.shop-backend-static.tls.certResolver=letsencrypt
      - traefik.http.routers.shop-backend-static.middlewares=shop-static-cache
      - traefik.http.routers.shop-backend-static.service=shop-static
      - traefik.http.services.shop-static.loadbalancer.server.port=80
      - traefik.http.routers.shop-backend-static.priority=20
      - traefik.http.routers.shop-store-static.rule=Host(`${STORE_HOST}`) && PathPrefix(`/static`)
      - traefik.http.routers.shop-store-static.entrypoints=websecure
      - traefik.http.routers.shop-store-static.tls.certResolver=letsencrypt
      - traefik.http.routers.shop-store-static.middlewares=shop-static-cache
      - traefik.http.routers.shop-store-static.service=shop-static
      - traefik.http.routers.shop-store-static.priority=20

  storefront:
    image: ${STOREFRONT_IMAGE:-ghcr.io/akhilya/printo-shop/storefront:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-storefront.rule=Host(`${STORE_HOST}`)
      - traefik.http.routers.shop-storefront.entrypoints=websecure
      - traefik.http.routers.shop-storefront.tls.certResolver=letsencrypt
      - traefik.http.routers.shop-storefront.priority=10
      - traefik.http.services.shop-storefront.loadbalancer.server.port=80
      - traefik.http.routers.shop-storefront-www.rule=Host(`www.${STORE_HOST}`)
      - traefik.http.routers.shop-storefront-www.entrypoints=websecure
      - traefik.http.routers.shop-storefront-www.tls.certResolver=letsencrypt
      # Dokploy domain routers default to the rule length (~30) and were
      # beating this redirect, so www kept serving the shop.
      - traefik.http.routers.shop-storefront-www.priority=10000
      - traefik.http.routers.shop-storefront-www.middlewares=shop-www-redirect
      - traefik.http.routers.shop-storefront-www.service=shop-storefront
      - traefik.http.middlewares.shop-www-redirect.redirectregex.regex=^https://www.${STORE_HOST}(.*)
      - traefik.http.middlewares.shop-www-redirect.redirectregex.replacement=https://${STORE_HOST}$${1}
      - traefik.http.middlewares.shop-www-redirect.redirectregex.permanent=true

volumes:
  shop_pgdata:
  shop_redis:
  shop_uploads:

networks:
  dokploy-network:
    external: true
