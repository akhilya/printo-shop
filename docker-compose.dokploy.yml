services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - shop_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shop_uploads:/app/static
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-backend.rule=Host(`${API_HOST}`)
      - traefik.http.routers.shop-backend.entrypoints=websecure
      - traefik.http.routers.shop-backend.tls.certResolver=letsencrypt
      - traefik.http.services.shop-backend.loadbalancer.server.port=9000

  storefront:
    build:
      context: .
      dockerfile: docker/storefront.Dockerfile
      args:
        VITE_MEDUSA_BACKEND_URL: ${VITE_MEDUSA_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-storefront.rule=Host(`${STORE_HOST}`)
      - traefik.http.routers.shop-storefront.entrypoints=websecure
      - traefik.http.routers.shop-storefront.tls.certResolver=letsencrypt
      - traefik.http.services.shop-storefront.loadbalancer.server.port=80

volumes:
  shop_postgres:
  shop_redis:
  shop_uploads:

networks:
  dokploy-network:
    external: true
