server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/xml text/plain application/json;

  location = /sitemap.xml {
    proxy_pass ${BACKEND_URL}/hooks/shop-sitemap;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
  }

  location = /llms.txt {
    proxy_pass ${BACKEND_URL}/hooks/shop-llms;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
  }

  location = /llms-full.txt {
    proxy_pass ${BACKEND_URL}/hooks/shop-llms-full;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
  }

  location = /llm.json {
    proxy_pass ${BACKEND_URL}/hooks/shop-llm-json;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
  }

  location = /robots.txt {
    expires 1d;
    add_header Cache-Control "public";
  }

  location = /ai.txt {
    expires 1d;
    add_header Cache-Control "public";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires 1d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|webp|png|svg|woff2|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
